version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:7
    container_name: meetnet-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - meetnet-network

  # Backend Express Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: meetnet-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/nexusnetwork
      - CLIENT_URL=http://localhost
      - FRONTEND_URL=http://localhost
      - JWT_SECRET=${JWT_SECRET:-meetnet_secret_key_change_in_prod}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    depends_on:
      - mongo
    networks:
      - meetnet-network

  # Frontend Vite/React Application
  frontend:
    build:
      context: ./nexusnetwork
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
        - VITE_ADMIN_EMAIL=${VITE_ADMIN_EMAIL:-}
    container_name: meetnet-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - meetnet-network

volumes:
  mongo_data:
    driver: local

networks:
  meetnet-network:
    driver: bridge
