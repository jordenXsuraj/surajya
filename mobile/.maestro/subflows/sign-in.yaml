# Signs in as ${EMAIL} / ${PASSWORD} unless the app is already signed in. After signing in, Home
# offers the notifications pre-prompt: answered "Not now" (dismiss-push-prompt.yaml).
appId: com.themeetnet.app.dev
---
- runFlow:
    when:
      notVisible: "Create a post"
    commands:
      - tapOn: "Log In"
      - tapOn: "Enter your Email"
      - inputText: ${EMAIL}
      - tapOn: "Password"
      - inputText: ${PASSWORD}
      # the password field submits the form ("done" key)
      - pressKey: Enter
      # Home, or already the pre-prompt on top of it (it opens ~1 s after Home appears)
      - extendedWaitUntil:
          visible: "Create a post|Turn on notifications\\?"
          timeout: 30000
      - runFlow: dismiss-push-prompt.yaml
- extendedWaitUntil:
    visible: "Create a post"
    timeout: 30000
