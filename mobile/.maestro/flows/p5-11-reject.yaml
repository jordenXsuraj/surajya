# Prompt 5 · Me → Follow requests (Kabir, Rohan, Sana) → Reject Kabir → Rohan and Sana are left.
appId: com.themeetnet.app.dev
name: Reject request
---
- runFlow: ../subflows/open-me.yaml
- extendedWaitUntil:
    visible: "🤝 Follow requests \\(3\\)"
    timeout: 20000
- tapOn: "🤝 Follow requests \\(3\\)"
- extendedWaitUntil:
    visible: "Kabir Shah"
    timeout: 20000
- assertVisible: "Rohan Kale"
- assertVisible: "Sana Shaikh"
- tapOn:
    text: "Reject Kabir Shah's follow request"
    label: "Reject [watch]"
- extendedWaitUntil:
    notVisible: "Kabir Shah"
    timeout: 10000
- assertVisible: "Rohan Kale"
- assertVisible: "Sana Shaikh"
- back
