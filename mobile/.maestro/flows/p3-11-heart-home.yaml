# Prompt 3 · Before the double-tap on Home: the image fixture post on screen.
appId: com.themeetnet.app.dev
name: Heart on Home — prepare
---
- runFlow: ../subflows/ensure-home.yaml
- scrollUntilVisible:
    element:
      text: "Post image.*"
      below: ".*${RUN} image fixture.*"
    direction: DOWN
    timeout: 60000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
