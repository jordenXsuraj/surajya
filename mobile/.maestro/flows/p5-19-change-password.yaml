# Prompt 5 · Settings → Change password: a wrong current password is refused (server message under
# the field); the right one changes it (toast) and the app stays signed in. The runner checks the
# new password works and changes it back.
appId: com.themeetnet.app.dev
name: Change password
---
- runFlow: ../subflows/open-me.yaml
- tapOn: "Settings"
- extendedWaitUntil:
    visible: ".*Change password"
    timeout: 15000
- tapOn: ".*Change password"
- extendedWaitUntil:
    visible: "Current password"
    timeout: 15000
- tapOn: "Current password"
- inputText: "wrong-password-1"
- tapOn: "New password \\(min 8\\)"
- inputText: "MeetNet-Test-2026-b"
- tapOn: "Repeat new password"
- inputText: "MeetNet-Test-2026-b"
- runFlow: ../subflows/hide-keyboard.yaml
- tapOn:
    id: "change-password-submit"
- extendedWaitUntil:
    visible: "Current password is incorrect"
    timeout: 15000
- tapOn: "Current password"
- eraseText: 30
- inputText: "${PASSWORD}"
- runFlow: ../subflows/hide-keyboard.yaml
- tapOn:
    id: "change-password-submit"
    label: "Change password [watch]"
- extendedWaitUntil:
    visible: ".*Blocked users"
    timeout: 20000
- back
- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 15000
