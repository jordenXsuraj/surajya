# Prompt 4 · Link gets https://, tags are cleaned (no #, no duplicates, max 5).
appId: com.themeetnet.app.dev
name: Link and tags
---
- runFlow: ../subflows/open-compose.yaml
- tapOn:
    id: "compose-text"
- inputText: "Maestro ${RUN} link tags post"
- runFlow: ../subflows/form-bottom.yaml
- tapOn: ".*Link"
- runFlow: ../subflows/form-bottom.yaml
- tapOn: "GitHub, Drive, LinkedIn, Notion..."
- inputText: "github.com/test"
- runFlow: ../subflows/form-bottom.yaml
- assertVisible: "Opens https://github.com/test"
# at 360 dp the Tags chip is off screen in the attachment row (it scrolls sideways): swipe the row
# from the PDF chip (".*Link" would also match the "Any Link" label)
- swipe:
    from:
      text: ".*PDF"
    direction: LEFT
- tapOn: ".*Tags"
- runFlow: ../subflows/form-bottom.yaml
- tapOn: "DSA, placement, TCS"
- inputText: "#DSA, placement, TCS, DSA, a, b, c"
- runFlow: ../subflows/form-bottom.yaml
- assertVisible: "#DSA"
- assertVisible: "#placement"
- assertVisible: "#TCS"
- assertVisible: "#a"
- assertVisible: "#b"
- assertNotVisible: "#c"
- assertVisible: ".*5 Tags"
- runFlow:
    file: ../subflows/post-and-check-home.yaml
    env:
      POST_TEXT: "${RUN} link tags post"
