# Prompt 4 · iPhone HEIC photo (4032x3024): compressed to JPEG on the phone, uploaded, posted.
appId: com.themeetnet.app.dev
name: HEIC photo
---
- runFlow: ../subflows/open-compose.yaml
- tapOn:
    id: "compose-text"
- inputText: "Maestro ${RUN} heic photo post"
- runFlow:
    file: ../subflows/pick-photo.yaml
    env:
      PHOTO_DATE: "(Jan 2,|2 Jan) 2031"
- extendedWaitUntil:
    visible: ".*Uploaded"
    timeout: 120000
- runFlow:
    file: ../subflows/post-and-check-home.yaml
    env:
      POST_TEXT: "${RUN} heic photo post"
