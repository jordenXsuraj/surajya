# Prompt 7 · ⋯ on a reply → Block its author: the reply leaves the open post at once (no refresh).
appId: com.themeetnet.app.dev
name: Block from a reply
---
- runFlow: ../subflows/ensure-home.yaml
- openLink: meetnet-dev://post/${POST_ID}
- extendedWaitUntil:
    visible: ".*${RUN} p7 reply to block.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "More options for Aditi Kulkarni's reply"
- tapOn: ".*Block Aditi"
- assertVisible: "Block Aditi Kulkarni."
- tapOn:
    text: "(?i)block"
    label: "Confirm block [watch]"
- extendedWaitUntil:
    notVisible: ".*${RUN} p7 reply to block.*"
    timeout: 5000
