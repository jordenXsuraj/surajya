# Prompt 3 · Block the author of another post (Sneha) from the ⋯ menu.
appId: com.themeetnet.app.dev
name: Block
---
- runFlow: ../subflows/ensure-home.yaml
- openLink: meetnet-dev://post/${BLOCK_POST_ID}
- extendedWaitUntil:
    visible: ".*${RUN} block fixture.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "More: save, share, report"
- tapOn: ".*Block Sneha"
- assertVisible: "Block Sneha Kulkarni."
# the toast is checked by the runner from the "[watch]" command on (on screen for 2.6 s only)
- tapOn:
    text: "(?i)block"
    label: "Confirm block [watch]"
- waitForAnimationToEnd:
    timeout: 3000
